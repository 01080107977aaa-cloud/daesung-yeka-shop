<script id="daesung-customer-order-lookup-db">
(function(){
  'use strict';

  const SUPABASE_URL='https://adtyszdqsdvebolhmcqk.supabase.co';
  const SUPABASE_ANON_KEY='sb_publishable_HeB11uBXSN0rZett8xqDFQ_qNyBuy4j';

  let db=null;
  try{
    if(window.supabase){
      db=window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );
    }
  }catch(e){
    console.error('주문조회 DB 연결 실패',e);
  }

  const h=s=>String(s??'').replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );

  const money=n=>
    Number(n||0).toLocaleString('ko-KR')+'원';

  function parseBuyer(v){
    const a=String(v||'').split('||');
    return {
      nickname:a[0]||'',
      name:a[1]||a[0]||''
    };
  }

  /* 고객에게는 상태 하나만 보여줍니다. */
  function customerStatus(o){
    if(
      o.cancel_status &&
      o.cancel_status!=='정상'
    ){
      return '주문취소';
    }

    if(
      o.shipping_status==='배송중' ||
      o.shipping_status==='배송완료'
    ){
      return '택배발송';
    }

    if(o.payment_status==='입금확인'){
      return '입금확인';
    }

    return '주문완료';
  }

  function statusClass(s){
    if(s==='입금확인') return 'lookup-status-paid';
    if(s==='택배발송') return 'lookup-status-ship';
    if(s==='주문취소') return 'lookup-status-cancel';
    return 'lookup-status-order';
  }

  window.lookupOrders=async function(){

    const result=document.getElementById('lookupResult');

    const phone=(
      document.getElementById('lp')?.value||''
    ).replace(/[^0-9]/g,'');

    const depositor=(
      document.getElementById('ld')?.value||''
    ).trim();

    if(!result) return;

    if(phone.length<10 || !depositor){
      result.innerHTML=
        '<div class="result">휴대폰번호와 입금자명을 정확하게 입력해주세요.</div>';
      return;
    }

    if(!db){
      result.innerHTML=
        '<div class="result">주문조회 DB 연결에 문제가 있습니다.</div>';
      return;
    }

    result.innerHTML=
      '<div class="result">주문내역을 조회하고 있습니다…</div>';

    const {data,error}=await db.rpc(
      'lookup_my_orders',
      {
        p_phone:phone,
        p_depositor_name:depositor
      }
    );

    if(error){
      result.innerHTML=
        '<div class="result">주문조회 오류<br>'+
        h(error.message)+
        '</div>';
      return;
    }

    const list=
      Array.isArray(data?.orders)
        ? data.orders
        : [];

    if(!list.length){
      result.innerHTML=
        '<div class="result">일치하는 주문이 없습니다.</div>';
      return;
    }

    result.innerHTML=list.map(o=>{

      const buyer=parseBuyer(o.buyer_name);

      const status=customerStatus(o);

      const items=
        Array.isArray(o.items)
          ? o.items
          : [];

      const itemHtml=items.map(i=>{

        const opt=[
          i.variety,
          i.weight
        ].filter(Boolean).join(' · ');

        return `
          <div class="lookup-item">
            <div class="lookup-item-name">
              <b>${h(i.product_name||'상품')}</b>
              ${opt
                ? `<span class="lookup-opt">${h(opt)}</span>`
                : ''
              }
            </div>

            <div class="lookup-item-price">
              ${Number(i.quantity||0)}개
              ×
              ${money(i.unit_price)}
              =
              <b>${money(i.amount)}</b>
            </div>
          </div>
        `;

      }).join('');

      const address=[
        o.address,
        o.detail_address
      ].filter(Boolean).join(' ');

      const trackHtml=o.tracking_number
        ? `
          <div class="lookup-info-box">
            <div class="lookup-info-title">배송정보</div>
            <div>송장번호 <b>${h(o.tracking_number)}</b></div>
            <a
              class="trackingBtn"
              href="https://www.lotteglogis.com/mobile/main"
              target="_blank"
              rel="noopener"
            >
              📦 롯데택배 운송장 조회
            </a>
          </div>
        `
        : `
          <div class="lookup-info-box">
            <div class="lookup-info-title">배송정보</div>
            <div>아직 송장번호가 등록되지 않았습니다.</div>
          </div>
        `;

      const cancelButton=
        status==='주문완료' ||
        status==='입금확인'
          ? `
            <button
              type="button"
              class="cancel"
              onclick="window.cancelOrder('${h(o.order_no||'')}')"
            >
              주문 취소
            </button>
          `
          : '';

      return `
        <div class="result order-result">

          <!-- 주문 기본정보 -->
          <div class="lookup-head">
            <div>
              <div class="lookup-order-no">
                ${h(o.order_no||'주문번호')}
              </div>

              <div class="lookup-date">
                ${o.created_at
                  ? h(
                      new Date(o.created_at)
                      .toLocaleString('ko-KR')
                    )
                  : ''
                }
              </div>
            </div>

            <div class="lookup-status-wrap">
              <span class="lookup-status ${statusClass(status)}">
                ${h(status)}
              </span>
            </div>
          </div>

          <!-- 상품 -->
          <div class="lookup-section">
            <div class="lookup-section-title">상품내역</div>

            <div class="lookup-items">
              ${
                itemHtml ||
                '<div>상품정보가 없습니다.</div>'
              }
            </div>
          </div>

          <!-- 주문자 -->
          <div class="lookup-section">

            <div class="lookup-section-title">
              주문자 정보
            </div>

            <div class="lookup-info-grid">

              <div>
                <span>카페닉네임</span>
                <b>${h(buyer.nickname||'-')}</b>
              </div>

              <div>
                <span>이름</span>
                <b>${h(buyer.name||'-')}</b>
              </div>

              <div>
                <span>휴대폰번호</span>
                <b>${h(o.buyer_phone||'-')}</b>
              </div>

              <div>
                <span>입금자명</span>
                <b>${h(o.depositor_name||'-')}</b>
              </div>

            </div>

          </div>

          <!-- 배송 -->
          <div class="lookup-section">

            <div class="lookup-section-title">
              배송정보
            </div>

            <div class="lookup-info-grid">

              <div>
                <span>받는 분</span>
                <b>${h(o.receiver_name||'-')}</b>
              </div>

              <div>
                <span>받는 분 휴대폰</span>
                <b>${h(o.receiver_phone||'-')}</b>
              </div>

              <div class="lookup-full">
                <span>배송지</span>
                <b>${h(address||'-')}</b>
              </div>

              <div class="lookup-full">
                <span>배송메모</span>
                <b>${h(o.delivery_memo||'-')}</b>
              </div>

            </div>

          </div>

          <!-- 결제 -->
          <div class="lookup-section">

            <div class="lookup-section-title">
              결제정보
            </div>

            <div class="lookup-total">
              최종 결제금액
              <b>${money(o.total_amount)}</b>
            </div>

            <div class="lookup-receipt">
              현금영수증
              <b>${h(o.cash_receipt_status||'미신청')}</b>
            </div>

          </div>

          <!-- 배송조회 -->
          ${trackHtml}

          ${cancelButton}

        </div>
      `;

    }).join('');
  };

  window.lookupDemo=window.lookupOrders;

  window.cancelOrder=async function(no){

    const phone=(
      document.getElementById('lp')?.value||''
    ).replace(/[^0-9]/g,'');

    const depositor=(
      document.getElementById('ld')?.value||''
    ).trim();

    if(!no || phone.length<10 || !depositor){
      return;
    }

    if(
      !confirm(
        '주문번호 '+no+
        ' 주문을 취소하시겠습니까?'
      )
    ){
      return;
    }

    if(!db){
      alert('주문취소 DB 연결에 문제가 있습니다.');
      return;
    }

    const {data,error}=await db.rpc(
      'cancel_my_order',
      {
        p_order_no:no,
        p_phone:phone,
        p_depositor_name:depositor
      }
    );

    if(error){
      alert(
        '주문취소 오류\n'+
        error.message
      );
      return;
    }

    alert(
      data?.message||
      '주문 취소 요청이 접수되었습니다.'
    );

    window.lookupOrders();
  };

  /* 조회 화면 스타일 */
  const st=document.createElement('style');

  st.textContent=`

    .order-result{
      padding:18px;
      margin-top:12px;
    }

    .lookup-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      border-bottom:1px solid #e7e7e7;
      padding-bottom:13px;
    }

    .lookup-order-no{
      font-size:17px;
      font-weight:900;
      color:#173426;
    }

    .lookup-date{
      margin-top:5px;
      color:#888;
      font-size:12px;
    }

    .lookup-status-wrap{
      flex-shrink:0;
    }

    .lookup-status{
      display:inline-block;
      padding:7px 12px;
      border-radius:999px;
      font-size:13px;
      font-weight:900;
      white-space:nowrap;
    }

    .lookup-status-order{
      background:#edf0ee;
      color:#46524b;
    }

    .lookup-status-paid{
      background:#fff1bf;
      color:#805e00;
    }

    .lookup-status-ship{
      background:#dff3e4;
      color:#176337;
    }

    .lookup-status-cancel{
      background:#ffe0e0;
      color:#a22c2c;
    }

    .lookup-section{
      margin-top:15px;
    }

    .lookup-section-title{
      font-weight:900;
      font-size:14px;
      color:#173426;
      margin-bottom:8px;
    }

    .lookup-items{
      border-top:1px solid #e8e8e8;
      border-bottom:1px solid #e8e8e8;
      padding:7px 0;
    }

    .lookup-item{
      padding:9px 0;
      border-bottom:1px dashed #ddd;
    }

    .lookup-item:last-child{
      border-bottom:0;
    }

    .lookup-item-name{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .lookup-opt{
      display:inline-block;
      padding:3px 8px;
      border-radius:999px;
      background:#f0f5f0;
      color:#456149;
      font-size:12px;
      font-weight:700;
    }

    .lookup-item-price{
      margin-top:5px;
      color:#555;
      font-size:13px;
    }

    .lookup-info-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .lookup-info-grid>div{
      background:#f7f9f7;
      border-radius:9px;
      padding:9px 10px;
    }

    .lookup-info-grid .lookup-full{
      grid-column:1/-1;
    }

    .lookup-info-grid span{
      display:block;
      color:#888;
      font-size:11px;
      margin-bottom:3px;
    }

    .lookup-info-grid b{
      display:block;
      color:#27342c;
      font-size:13px;
      line-height:1.45;
      word-break:break-word;
    }

    .lookup-total{
      margin-top:8px;
      padding:11px 12px;
      border-radius:9px;
      background:#f4f7f4;
      font-size:14px;
    }

    .lookup-total b{
      float:right;
      font-size:17px;
      color:#173426;
    }

    .lookup-receipt{
      margin-top:7px;
      font-size:13px;
      color:#555;
    }

    .lookup-receipt b{
      color:#173426;
    }

    .lookup-info-box{
      margin-top:15px;
      padding:12px;
      border:1px solid #dfe7df;
      border-radius:10px;
      background:#fafcf9;
      font-size:13px;
    }

    .lookup-info-title{
      font-weight:900;
      margin-bottom:6px;
      color:#173426;
    }

    .order-result .trackingBtn{
      display:block;
      width:100%;
      box-sizing:border-box;
      text-align:center;
      margin-top:9px;
      padding:10px 12px;
      border-radius:8px;
      background:#315d3e;
      color:#fff;
      text-decoration:none;
      font-weight:900;
    }

    .order-result .cancel{
      width:100%;
      margin-top:12px;
      min-height:42px;
    }

    @media(max-width:650px){

      .order-result{
        padding:14px;
      }

      .lookup-head{
        flex-direction:column;
      }

      .lookup-status-wrap{
        width:100%;
      }

      .lookup-status{
        display:block;
        text-align:center;
      }

      .lookup-info-grid{
        grid-template-columns:1fr;
      }

      .lookup-info-grid .lookup-full{
        grid-column:auto;
      }
    }

  `;

  document.head.appendChild(st);

})();
</script>
